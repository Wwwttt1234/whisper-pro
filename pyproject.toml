[project]
name = "whisper-pro"
version = "2.0.0"
description = "Local multilingual transcription and subtitle workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.67.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.7.1",
  "huggingface-hub==1.7.2",
  "av==17.0.0",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime==1.24.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy==2.3.2",
  "psutil==7.2.2",
  "pillow==13.0.0",
  "requests==2.33.1",
  "yt-dlp[default]==2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "pyinstaller>=6.15,<7",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-asyncio>=1.4.1.post1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "line-profiler>=5.1.0",
    "memory-profiler>=0.61.0",
    "py-spy>=0.4.3",
    "pytest-benchmark>=5.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
