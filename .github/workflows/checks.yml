name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            package: Windows-x64
          - os: ubuntu-22.04
            package: Linux-x64
          - os: ubuntu-24.04-arm
            package: Linux-arm64
          - os: macos-15
            package: macOS-arm64
          - os: macos-15-intel
            package: macOS-x64
    runs-on: ${{ matrix.os }}
    env:
      WHISPER_PRO_DISABLE_AUTOCHECK: '1'
      WHISPER_PRO_NO_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.14'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check core engine ui app.py launcher.py desktop_launcher.py tests
      - run: uv run --locked pytest -q
      - name: Verify first launch and source relocation
        run: uv run --locked python tests/smoke_startup.py
      - run: uv run --locked python build_release.py --archive ${{ matrix.package }}
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: release-package-${{ matrix.package }}
          path: packages/
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: packages
      - name: Create the draft with verified platform packages
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum WhisperPro-* > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf '%s\n' 'A release for this tag already exists. Review it in Releases.'
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" WhisperPro-* SHA256SUMS.txt --verify-tag --draft --generate-notes
